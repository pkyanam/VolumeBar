name: Build and Release

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: volumebar-${{ github.workflow }}-${{ github.ref }}
  # Cancel outdated PR builds, but let signing/notarization finish on trusted pushes.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ARCH: arm64
  DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer

jobs:
  build:
    name: Test and build (Apple Silicon)
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify toolchain
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          xcodebuild -version
          swift --version
          bash -n Scripts/*.sh
      - name: Test DSP
        run: swift test -j 2
      - name: Build and verify app
        env:
          CI_BUILD_NUMBER: ${{ github.run_number }}
        run: ./Scripts/build.sh
      - name: Package development artifact
        run: ./Scripts/package.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: VolumeBar-arm64-unsigned-${{ github.sha }}
          path: |
            dist/VolumeBar-arm64.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
      - name: Build summary
        run: |
          echo '### Apple Silicon app built and tested' >> "$GITHUB_STEP_SUMMARY"
          echo 'The artifact is ad-hoc signed for development. Use a notarized GitHub Release for normal installation.' >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Sign, notarize, and publish
    needs: build
    if: >-
      github.event_name != 'pull_request' &&
      vars.SIGNING_ENABLED == 'true' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: macos-15
    timeout-minutes: 60
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release source
        env:
          RELEASE_REF: ${{ github.ref }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git merge-base --is-ancestor HEAD origin/main
          source version.env
          if [[ "$RELEASE_REF" == refs/tags/* ]]; then
            test "$RELEASE_TAG" = "v$VERSION"
          fi
      - name: Sign and notarize
        env:
          CI_BUILD_NUMBER: ${{ github.run_number }}
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: ./Scripts/ci-sign-and-notarize.sh
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REF: ${{ github.ref }}
          RELEASE_TAG: ${{ github.ref_name }}
          BUILD_SEQUENCE: ${{ github.run_number }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          source version.env
          if [[ "$RELEASE_REF" == refs/tags/* ]]; then
            TAG="$RELEASE_TAG"
            TITLE="VolumeBar $VERSION"
            FLAGS=(--latest)
          else
            TAG="build-$BUILD_SEQUENCE-${COMMIT_SHA:0:7}"
            TITLE="VolumeBar development build $BUILD_SEQUENCE"
            FLAGS=(--prerelease --latest=false)
          fi
          printf 'Native Apple Silicon build for macOS 14.4+.\n\nOpen the DMG and drag VolumeBar into Applications. On first launch, adjust an app slider and allow System Audio Recording if prompted.\n\nDeveloper ID signed, notarized by Apple, and stapled. SHA-256 checksums are included.\n\nSource commit: %s\n' "$COMMIT_SHA" > "$RUNNER_TEMP/release-notes.md"
          # Stage assets in a draft so a failed upload never exposes a partial release.
          if gh release view "$TAG" --json isDraft --jq .isDraft > "$RUNNER_TEMP/draft-status" 2>/dev/null; then
            if [[ "$(cat "$RUNNER_TEMP/draft-status")" != true ]]; then
              echo "Release $TAG already published; leaving its immutable assets intact."
              exit 0
            fi
          else
            gh release create "$TAG" --target "$COMMIT_SHA" --draft --title "$TITLE" --notes-file "$RUNNER_TEMP/release-notes.md" "${FLAGS[@]}"
          fi
          gh release upload "$TAG" dist/VolumeBar-arm64.zip dist/VolumeBar-arm64.dmg dist/SHA256SUMS.txt --clobber
          gh release edit "$TAG" --draft=false "${FLAGS[@]}"
          echo "Published $TAG" >> "$GITHUB_STEP_SUMMARY"
      - name: Save notarization diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: notarization-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/*notarization*.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Remove signing material even after failure
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/volumebar-signing/signing.keychain-db" >/dev/null 2>&1 || true
          rm -rf "$RUNNER_TEMP/volumebar-signing"
          rm -f "$RUNNER_TEMP/VolumeBar-notarization.zip"
